name: Deploy NOEMA website

# GitHub Pages is enabled; deploy on main updates and allow manual runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: noema-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned site build dependency
        run: python -m pip install --disable-pip-version-check -r requirements-site.txt
      - name: Validate draft completeness
        run: python scripts/validate_drafts.py
      - name: Validate approved publication index
        run: python scripts/validate_research.py
      - name: Build public site artifact
        run: python scripts/build_site.py --output _site
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
