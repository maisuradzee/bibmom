          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_formats = {"binary32", "binary64", "decimal64", "decimal128"}
          if {case["format"] for case in report["cases"]} != expected_formats:
              raise SystemExit("NOEMA-005 benchmark format coverage mismatch")
          if len(report["cases"]) != 8:
              raise SystemExit("NOEMA-005 benchmark size/format case count mismatch")
          for case in report["cases"]:
              if not case["methods"]:
                  raise SystemExit(f"No benchmark methods recorded for {case['format']}")
              for method in case["methods"]:
                  if method["median_runtime_ns"] <= 0 or method["peak_traced_python_bytes"] < 0:
                      raise SystemExit(f"Invalid benchmark measurement: {case['format']}/{method['method']}")
          print("NOEMA-005 runtime/memory benchmark smoke test OK")
          PY
      - name: Reproduce NOEMA-005 sharded reduction simulation and compare frozen results
        id: check_36_reproduce_noema_005_sharded_reduction_
        continue-on-error: true
        run: |
          python --version
          python -c "import platform; print(platform.platform())"
          python scripts/simulate_noema005_parallel_reduction.py --output "$RUNNER_TEMP/noema005-parallel.json"
          python - "$RUNNER_TEMP/noema005-parallel.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-005/parallel-reduction-results.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-005 parallel reduction results differ from frozen summary")
          print("NOEMA-005 parallel reduction simulation matches 330-case frozen summary")
          PY
      - name: Run finite-sample simulation smoke test
        id: check_37_run_finite_sample_simulation_smoke_tes
        continue-on-error: true
        run: python scripts/short_sequence_bias_simulation.py --trials 2000
      - name: Build public site and verify publication boundary
        id: check_38_build_public_site_and_verify_publicati
        continue-on-error: true
        run: |
          python scripts/build_site.py --output "$RUNNER_TEMP/noema-site"
          test -f "$RUNNER_TEMP/noema-site/index.html"
          test -f "$RUNNER_TEMP/noema-site/assets/articles.css"
          test -f "$RUNNER_TEMP/noema-site/data/research.json"
          test ! -d "$RUNNER_TEMP/noema-site/research/drafts"
          test ! -d "$RUNNER_TEMP/noema-site/research/published"
      - name: Verify pinned SignBase 2.0 audit snapshot
        id: check_39_verify_pinned_signbase_2_0_audit_snaps
        continue-on-error: true
        run: |
          BASE="https://raw.githubusercontent.com/christianbentz/PaleoSigns/b376bd87d9676fbf63f8555d03e06b4c28113740/data/signBase"
          curl --fail --location --silent --show-error "$BASE/Sb2Artifact-2025-03-06.csv" --output /tmp/signbase-objects.csv
          curl --fail --location --silent --show-error "$BASE/Sign-2025-03-06.csv" --output /tmp/signbase-signs.csv
          python scripts/audit_signbase.py \
            --artifacts /tmp/signbase-objects.csv \
            --dictionary /tmp/signbase-signs.csv \
            --output /tmp/signbase-audit.json
          diff -u data/audits/signbase-v2-audit-2026-11-23.json /tmp/signbase-audit.json
      - name: Check HTML document basics
        id: check_40_check_html_document_basics
        continue-on-error: true
        run: |
          grep -q '<html lang="ka">' index.html
          grep -q '<title>NOEMA' index.html

      - name: Summarize validation outcomes
        id: summarize_validation_outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
          RECOVERY_REPORT: ${{ runner.temp }}/noema-ci-recovery-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = json.loads(os.environ.get("STEP_OUTCOMES", "{}"))
          rows = []
          for step_id, details in outcomes.items():
              if step_id == "summarize_validation_outcomes": continue
              rows.append({"id": step_id, "outcome": details.get("outcome", "unknown")})
          failures = [row for row in rows if row["outcome"] == "failure"]
          skipped = [row for row in rows if row["outcome"] == "skipped"]
          recovery_path = Path(os.environ["RECOVERY_REPORT"])
          recovery = json.loads(recovery_path.read_text(encoding="utf-8")) if recovery_path.exists() else None
          report = {"failed_steps": failures, "skipped_steps": skipped, "step_count": len(rows), "recovery": recovery, "policy": "Continue independent checks; never promote URLs or rewrite scientific claims/test expectations."}
          output = Path(os.environ["RUNNER_TEMP"]) / "noema-ci-recovery-report.json"
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## NOEMA CI recovery report\n\n")
              handle.write(f"- Validation steps observed: **{len(rows)}**\n")
              handle.write(f"- Failed steps: **{len(failures)}**\n")
              handle.write(f"- Skipped steps: **{len(skipped)}**\n")
              if failures:
                  handle.write("\n### Failed checks\n\n")
                  for item in failures: handle.write(f"- `{item['id']}`\n")
              if recovery:
                  handle.write(f"\n- Draft files scanned: **{recovery['draft_files_scanned']}**\n")
                  handle.write(f"- Files with safe repairs: **{len(recovery['files_with_safe_repairs'])}**\n")
                  handle.write(f"- Unsafe source-list URLs flagged: **{len(recovery['unsafe_source_urls'])}**\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if failures: raise SystemExit(1)
          PY
      - name: Upload CI recovery diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: noema-ci-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/noema-ci-recovery-report.json
            ${{ runner.temp }}/noema-ci-recovery.patch
          if-no-files-found: warn
          retention-days: 14
