      - name: Bounded draft recovery and explicit source URL audit
        id: bounded_draft_recovery
        continue-on-error: true
        env:
          RECOVERY_REPORT: ${{ runner.temp }}/noema-ci-recovery-report.json
          RECOVERY_PATCH: ${{ runner.temp }}/noema-ci-recovery.patch
        run: python scripts/ci_recovery.py --fix --report "$RECOVERY_REPORT" --patch "$RECOVERY_PATCH"
