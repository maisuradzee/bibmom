name: NOEMA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned site and research-analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-site.txt
          python -m pip install --disable-pip-version-check numpy==2.3.4
      - name: Validate required files
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/articles.css
          test -f requirements-site.txt
          test -f data/research.json
          test -f research/TEMPLATE.md
          test -f scripts/validate_research.py
          test -f scripts/validate_drafts.py
          test -f scripts/build_site.py
          test -f scripts/short_sequence_bias_simulation.py
          test -f scripts/audit_signbase.py
          test -f scripts/analyze_noema003.py
          test -f scripts/compare_noema003_datasets.py
          test -f scripts/analyze_hadcrut_ensemble.py
          test -f scripts/reconstruct_hadcrut_coverage.py
          test -f scripts/simulate_noema005_summation.py
          test -f data/noema-005/floating-summation-results.json
          test -f research/drafts/NOEMA-2026-005-floating-summation-order.md
          test -f data/noema-003/cross-dataset-results-2026-11-23.json
          test -f data/noema-003/hadcrut5-5.2.0.0/HadCRUT.5.2.0.0.analysis.ensemble_series.global.annual.csv
          test -f data/noema-003/hadcrut5-5.2.0.0/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv
          test -f data/noema-003/hadcrut5-5.2.0.0/ensemble-trend-results-1979-2025.json
          test -f data/noema-003/hadcrut5-5.2.0.0/source-manifest.json
          test -f data/noema-003/snapshots/2026.10/sources.json
          test -f data/noema-003/snapshots/2026.10/gistemp.csv
          test -f data/noema-003/snapshots/2026.10/hadcrut5_annual.csv
          test -f data/noema-003/snapshots/2026.10/noaaglobaltemp_annual.asc
          test -f data/noema-003/noaa-globaltemp-v6.1.0-global-annual-202606.csv
          test -f data/noema-003/dataset-metadata-2026-11-23.json
          test -f data/noema-003/trend-sensitivity-results-2026-11-23.json
          test -f tests/test_analyze_noema003.py
          test -f tests/test_compare_noema003_datasets.py
          test -f tests/test_analyze_hadcrut_ensemble.py
          test -f tests/test_reconstruct_hadcrut_coverage.py
          test -f tests/test_noema005_summation.py
          test -f docs/RESEARCH_STANDARD.md
          test -f research/protocols/NOEMA-002-blind-coding-protocol.md
      - name: Validate draft completeness
        run: python scripts/validate_drafts.py
      - name: Validate research index
        run: python scripts/validate_research.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce NOEMA-003 trend analysis and compare frozen results
        run: |
          python scripts/analyze_noema003.py --output "$RUNNER_TEMP/noema003-results.json"
          python - "$RUNNER_TEMP/noema003-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-003/trend-sensitivity-results-2026-11-23.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-003 generated results differ from frozen results")
          print("NOEMA-003 frozen results match")
          PY
      - name: Reproduce NOEMA-003 cross-dataset comparison and check frozen results
        run: |
          python scripts/compare_noema003_datasets.py --output "$RUNNER_TEMP/noema003-cross-results.json"
          python - "$RUNNER_TEMP/noema003-cross-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-003/cross-dataset-results-2026-11-23.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-003 cross-dataset results differ from the frozen result")
          print("NOEMA-003 cross-dataset frozen results match")
          PY
      - name: Reproduce HadCRUT5 200-member trend distribution and verify source hashes
        run: |
          SNAP="data/noema-003/hadcrut5-5.2.0.0"
          python scripts/analyze_hadcrut_ensemble.py \
            --input "$SNAP/HadCRUT.5.2.0.0.analysis.ensemble_series.global.annual.csv" \
            --summary-csv "$SNAP/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv" \
            --output "$RUNNER_TEMP/hadcrut5-ensemble-results.json"
          python - "$RUNNER_TEMP/hadcrut5-ensemble-results.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path("data/noema-003/hadcrut5-5.2.0.0")
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          for filename, metadata in manifest["files"].items():
              actual_hash = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              if actual_hash != metadata["sha256"]:
                  raise SystemExit(f"HadCRUT5 source hash mismatch: {filename}")
          expected = json.loads((root / "ensemble-trend-results-1979-2025.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              import difflib
              expected_text = json.dumps(expected, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              actual_text = json.dumps(actual, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              print("\\n".join(difflib.unified_diff(expected_text, actual_text, fromfile="pinned", tofile="generated")))
              raise SystemExit("HadCRUT5 generated ensemble results differ from pinned results")
          print("HadCRUT5 5.2.0.0 source hashes and 200-member results match")
          PY
      - name: Reproduce NOEMA-005 summation experiment and compare frozen results
        run: |
          python scripts/simulate_noema005_summation.py --output "$RUNNER_TEMP/noema005-results.json"
          python - "$RUNNER_TEMP/noema005-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-005/floating-summation-results.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          # Runtime/platform metadata is recorded for provenance but is not
          # expected to match across independent CI runner images.
          expected.pop("environment", None)
          actual.pop("environment", None)
          if actual != expected:
              raise SystemExit("NOEMA-005 generated summation results differ from frozen results")
          print("NOEMA-005 summation results match the frozen snapshot")
          PY
      - name: Run finite-sample simulation smoke test
        run: python scripts/short_sequence_bias_simulation.py --trials 2000
      - name: Build public site and verify publication boundary
        run: |
          python scripts/build_site.py --output "$RUNNER_TEMP/noema-site"
          test -f "$RUNNER_TEMP/noema-site/index.html"
          test -f "$RUNNER_TEMP/noema-site/assets/articles.css"
          test -f "$RUNNER_TEMP/noema-site/data/research.json"
          test ! -d "$RUNNER_TEMP/noema-site/research/drafts"
          test ! -d "$RUNNER_TEMP/noema-site/research/published"
      - name: Verify pinned SignBase 2.0 audit snapshot
        run: |
          BASE="https://raw.githubusercontent.com/christianbentz/PaleoSigns/b376bd87d9676fbf63f8555d03e06b4c28113740/data/signBase"
          curl --fail --location --silent --show-error "$BASE/Sb2Artifact-2025-03-06.csv" --output /tmp/signbase-objects.csv
          curl --fail --location --silent --show-error "$BASE/Sign-2025-03-06.csv" --output /tmp/signbase-signs.csv
          python scripts/audit_signbase.py \
            --artifacts /tmp/signbase-objects.csv \
            --dictionary /tmp/signbase-signs.csv \
            --output /tmp/signbase-audit.json
          diff -u data/audits/signbase-v2-audit-2026-11-23.json /tmp/signbase-audit.json
      - name: Check HTML document basics
        run: |
          grep -q '<html lang="ka">' index.html
          grep -q '<title>NOEMA' index.html
