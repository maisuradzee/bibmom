name: NOEMA quality checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned site and research-analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-site.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check numpy==2.3.4
      - name: Validate required files
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/articles.css
          test -f requirements-site.txt
          test -f requirements-test.txt
          test -f data/research.json
          test -f data/noema-005/real-cpu-thread-summary-2026-11-26.json
          test -f data/noema-005/threaded-artifact-provenance-audit-2026-11-26.json
          test -f research/drafts/NOEMA-2026-005-thread-artifact-provenance-audit-2026-11-26.md
          test -f tests/test_noema005_thread_artifact_audit.py
          test -f data/noema-005/threaded-rerun-2026-11-26.json
          test -f scripts/validate_noema005_threaded_rerun.py
          test -f tests/test_noema005_threaded_rerun.py
          test -f data/noema-005/threaded-reruns-2026-11-26.json
          test -f data/noema-005/raw/run-45867519546-gil-enabled.json.gz.b64
          test -f data/noema-005/raw/run-45867519546-free-threaded.json.gz.b64
          test -f scripts/reproduce_noema005_threaded_reruns.py
          test -f tests/test_noema005_threaded_reruns.py
          test -f data/noema-005/threaded-rerun-2026-11-27-run23.json
          test -f data/noema-005/raw/run-45972740197-gil-enabled.json.gz.b64
          test -f data/noema-005/raw/run-45972740197-free-threaded.json.gz.b64
          test -f scripts/reproduce_noema005_run23.py
          test -f tests/test_noema005_run23.py
          test -f research/drafts/NOEMA-2026-005-run23-hosted-rerun-2026-11-27.md
          test -f scripts/validate_noema005_cpu_thread_summary.py
          test -f tests/test_noema005_cpu_thread_summary.py
          test -f data/noema-007/mhews-2026-source-snapshot.json
          test -f data/noema-007/mhews-2026-derived-results.json
          test -f scripts/reproduce_noema007_mhews_snapshot.py
          test -f tests/test_noema007_mhews_snapshot.py
          test -f data/noema-007/wmo-roadmaps-2026-source-snapshot.json
          test -f data/noema-007/wmo-roadmaps-2026-derived-results.json
          test -f data/noema-007/action-readiness-observation.schema.json
          test -f noema_core/action_readiness.py
          test -f scripts/reproduce_noema007_wmo_roadmaps.py
          test -f tests/test_noema007_wmo_roadmaps.py
          test -f data/noema-007/anticipatory-action-2025-source-snapshot.json
          test -f data/noema-007/anticipatory-action-2025-derived-results.json
          test -f scripts/reproduce_noema007_anticipatory_action.py
          test -f tests/test_noema007_anticipatory_action.py
          test -f tests/test_noema007_action_readiness.py
          test -f data/noema-006/source-access-inventory.schema.json
          test -f data/noema-006/source-access-inventory-2026-11-27.json
          test -f tests/test_noema006_source_access_inventory.py
          test -f research/TEMPLATE.md
          test -f scripts/validate_research.py
          test -f scripts/validate_drafts.py
          test -f scripts/build_site.py
          test -f scripts/short_sequence_bias_simulation.py
          test -f scripts/audit_signbase.py
          test -f scripts/analyze_noema003.py
          test -f scripts/compare_noema003_datasets.py
          test -f scripts/analyze_hadcrut_ensemble.py
          test -f scripts/reconstruct_hadcrut_coverage.py
          test -f scripts/simulate_noema005_summation.py
          test -f scripts/benchmark_noema005_summation.py
          test -f scripts/simulate_noema005_parallel_reduction.py
          test -f data/noema-005/parallel-reduction-protocol.json
          test -f data/noema-005/parallel-reduction-results.json
          test -f tests/test_noema005_parallel_reduction.py
          test -f data/noema-005/benchmark-protocol.json
          test -f tests/test_benchmark_noema005_summation.py
          test -f data/noema-005/floating-summation-results.json
          test -f research/drafts/NOEMA-2026-005-floating-summation-order.md
          test -f data/noema-003/cross-dataset-results-2026-11-23.json
          test -f data/noema-003/hadcrut5-5.2.0.0/HadCRUT.5.2.0.0.analysis.ensemble_series.global.annual.csv
          test -f data/noema-003/hadcrut5-5.2.0.0/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv
          test -f data/noema-003/hadcrut5-5.2.0.0/ensemble-trend-results-1979-2025.json
          test -f data/noema-003/hadcrut5-5.2.0.0/source-manifest.json
          test -f data/noema-003/snapshots/2026.10/sources.json
          test -f data/noema-003/snapshots/2026.10/gistemp.csv
          test -f data/noema-003/snapshots/2026.10/hadcrut5_annual.csv
          test -f data/noema-003/snapshots/2026.10/noaaglobaltemp_annual.asc
          test -f data/noema-003/noaa-globaltemp-v6.1.0-global-annual-202606.csv
          test -f data/noema-003/dataset-metadata-2026-11-23.json
          test -f data/noema-003/trend-sensitivity-results-2026-11-23.json
          test -f tests/test_analyze_noema003.py
          test -f tests/test_compare_noema003_datasets.py
          test -f tests/test_analyze_hadcrut_ensemble.py
          test -f tests/test_reconstruct_hadcrut_coverage.py
          test -f tests/test_noema005_summation.py
          test -f docs/RESEARCH_STANDARD.md
          test -f docs/CORE_MISSION.md
          test -f docs/AUTONOMY_ARCHITECTURE.md
          test -f noema_core/__init__.py
          test -f noema_core/aquasignal.py
          test -f noema_core/mission.py
          test -f noema_core/mission.json
          test -f scripts/validate_mission.py
          test -f tests/test_aquasignal.py
          test -f tests/test_mission_core.py
          test -f noema_core/jobs.py
          test -f tests/test_database_backup.py
          test -f docs/OFFSITE_BACKUP_ARCHITECTURE.md
          test -f data/noema-backup-manifest.schema.json
          test -f noema_core/backup_manifest.py
          test -f data/noema-restore-attestation.schema.json
          test -f noema_core/restore_attestation.py
          test -f tests/test_restore_attestation_gate.py
          test -f docs/RESTORE_ATTESTATION_GATE.md
          test -f scripts/validate_noema_backup_manifest.py
          test -f tests/test_backup_manifest_runtime_validation.py
          test -f scripts/verify_noema_backup_artifacts.py
          test -f tests/test_backup_artifact_verification.py
          test -f scripts/verify_noema_backup_manifest_signature.py
          test -f tests/test_backup_manifest_signature.py
          test -f tests/test_offsite_backup_manifest_schema.py
          test -f noema_core/jobs_cli.py
          test -f tests/test_durable_job_queue.py
          test -f noema_core/worker.py
          test -f noema_core/supervisor.py
          test -f noema_core/workflows.py
          test -f noema_core/scheduler.py
          test -f noema_core/service.py
          test -f tests/test_noema_service.py
          test -f docs/SERVICE_DEPLOYMENT.md
          test -f deploy/systemd/noema.service
          test -f tests/test_interval_scheduler.py
          test -f tests/test_workflow_engine.py
          test -f tests/test_worker_supervisor.py
          test -f tests/test_noema_worker.py
          test -f scripts/validate_job_queue.py
          test -f research/protocols/NOEMA-002-blind-coding-protocol.md
      - name: Validate draft completeness
        run: python scripts/validate_drafts.py
      - name: Validate research index
        run: python scripts/validate_research.py
      - name: Reproduce NOEMA-007 WMO roadmap aggregates
        run: python scripts/reproduce_noema007_wmo_roadmaps.py --check
      - name: Reproduce NOEMA-007 anticipatory-action aggregates
        run: python scripts/reproduce_noema007_anticipatory_action.py --check
      - name: Validate AquaSignal source-access inventory schema
        run: python -m unittest discover -s tests -p 'test_noema006_source_access_inventory.py' -v
      - name: Validate NOEMA-007 action-readiness aggregate contract
        run: python -m unittest discover -s tests -p 'test_noema007_action_readiness.py' -v
      - name: Validate NOEMA mission and autonomy policy
        run: python scripts/validate_mission.py
      - name: Validate durable job queue
        run: python scripts/validate_job_queue.py
      - name: Validate NOEMA-005 raw artifact provenance audit
        run: python -m unittest discover -s tests -p 'test_noema005_thread_artifact_audit.py' -v
      - name: Validate frozen NOEMA-005 real CPU-thread benchmark summary
        run: python scripts/validate_noema005_cpu_thread_summary.py
      - name: Validate NOEMA-005 2026-11-26 threaded rerun summary
        run: python scripts/validate_noema005_threaded_rerun.py
      - name: Reproduce NOEMA-005 two-run threaded raw reports
        run: python scripts/reproduce_noema005_threaded_reruns.py --check
      - name: Test NOEMA-005 two-run threaded raw-report reproduction
        run: python -m unittest discover -s tests -p 'test_noema005_threaded_reruns.py' -v
      - name: Reproduce NOEMA-005 Run 23 hosted x86-64 raw reports
        run: python scripts/reproduce_noema005_run23.py --check
      - name: Test NOEMA-005 Run 23 hosted rerun
        run: python -m unittest discover -s tests -p 'test_noema005_run23.py' -v
      - name: Validate runnable NOEMA service entrypoint
        run: python -m noema_core.service --check --db "$RUNNER_TEMP/noema-service-check.sqlite3"
      - name: Validate offsite backup manifest schema contract
        run: python -m unittest discover -s tests -p 'test_offsite_backup_manifest_schema.py' -v
      - name: Validate backup manifest against Draft 2020-12 at runtime
        run: python -m unittest discover -s tests -p 'test_backup_manifest_runtime_validation.py' -v
      - name: Verify backup artifact digests against manifest
        run: python -m unittest discover -s tests -p 'test_backup_artifact_verification.py' -v
      - name: Verify detached Ed25519 backup manifest signature
        run: python -m unittest discover -s tests -p 'test_backup_manifest_signature.py' -v
      - name: Validate SQLite backup and restore CLI
        run: |
          DB="$RUNNER_TEMP/noema-ops.sqlite3"
          BACKUP="$RUNNER_TEMP/noema-ops-backup.sqlite3"
          RESTORED="$RUNNER_TEMP/noema-ops-restored.sqlite3"
          python -m noema_core.jobs_cli --db "$DB" metrics
          python -m noema_core.jobs_cli --db "$DB" backup --output "$BACKUP"
          python -m noema_core.jobs_cli restore --source "$BACKUP" --destination "$RESTORED"
          python -m noema_core.jobs_cli --db "$RESTORED" verify
          python -m noema_core.jobs_cli --db "$RESTORED" metrics
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce NOEMA-003 trend analysis and compare frozen results
        run: |
          python scripts/analyze_noema003.py --output "$RUNNER_TEMP/noema003-results.json"
          python - "$RUNNER_TEMP/noema003-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-003/trend-sensitivity-results-2026-11-23.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-003 generated results differ from frozen results")
          print("NOEMA-003 frozen results match")
          PY
      - name: Reproduce NOEMA-003 cross-dataset comparison and check frozen results
        run: |
          python scripts/compare_noema003_datasets.py --output "$RUNNER_TEMP/noema003-cross-results.json"
          python - "$RUNNER_TEMP/noema003-cross-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-003/cross-dataset-results-2026-11-23.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-003 cross-dataset results differ from the frozen result")
          print("NOEMA-003 cross-dataset frozen results match")
          PY
      - name: Reproduce HadCRUT5 200-member trend distribution and verify source hashes
        run: |
          SNAP="data/noema-003/hadcrut5-5.2.0.0"
          python scripts/analyze_hadcrut_ensemble.py \
            --input "$SNAP/HadCRUT.5.2.0.0.analysis.ensemble_series.global.annual.csv" \
            --summary-csv "$SNAP/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv" \
            --output "$RUNNER_TEMP/hadcrut5-ensemble-results.json"
          python - "$RUNNER_TEMP/hadcrut5-ensemble-results.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path("data/noema-003/hadcrut5-5.2.0.0")
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          for filename, metadata in manifest["files"].items():
              actual_hash = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              if actual_hash != metadata["sha256"]:
                  raise SystemExit(f"HadCRUT5 source hash mismatch: {filename}")
          expected = json.loads((root / "ensemble-trend-results-1979-2025.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              import difflib
              expected_text = json.dumps(expected, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              actual_text = json.dumps(actual, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              print("\\n".join(difflib.unified_diff(expected_text, actual_text, fromfile="pinned", tofile="generated")))
              raise SystemExit("HadCRUT5 generated ensemble results differ from pinned results")
          print("HadCRUT5 5.2.0.0 source hashes and 200-member results match")
          PY
      - name: Reproduce NOEMA-005 summation experiment and compare frozen results
        run: |
          python scripts/simulate_noema005_summation.py --output "$RUNNER_TEMP/noema005-results.json"
          python - "$RUNNER_TEMP/noema005-results.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-005/floating-summation-results.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          # Runtime/platform metadata is recorded for provenance but is not
          # expected to match across independent CI runner images.
          expected.pop("environment", None)
          actual.pop("environment", None)
          if actual != expected:
              import difflib
              expected_text = json.dumps(expected, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              actual_text = json.dumps(actual, ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              print("\\n".join(difflib.unified_diff(
                  expected_text, actual_text, fromfile="frozen", tofile="generated"
              )))
              raise SystemExit("NOEMA-005 generated summation results differ from frozen results")
          print("NOEMA-005 summation results match the frozen snapshot")
          PY
      - name: Run NOEMA-005 runtime and memory benchmark smoke test
        run: |
          python scripts/benchmark_noema005_summation.py \
            --sizes 128,512 --warmups 1 --repetitions 2 \
            --output "$RUNNER_TEMP/noema005-benchmark.json"
          python - "$RUNNER_TEMP/noema005-benchmark.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_formats = {"binary32", "binary64", "decimal64", "decimal128"}
          if {case["format"] for case in report["cases"]} != expected_formats:
              raise SystemExit("NOEMA-005 benchmark format coverage mismatch")
          if len(report["cases"]) != 8:
              raise SystemExit("NOEMA-005 benchmark size/format case count mismatch")
          for case in report["cases"]:
              if not case["methods"]:
                  raise SystemExit(f"No benchmark methods recorded for {case['format']}")
              for method in case["methods"]:
                  if method["median_runtime_ns"] <= 0 or method["peak_traced_python_bytes"] < 0:
                      raise SystemExit(f"Invalid benchmark measurement: {case['format']}/{method['method']}")
          print("NOEMA-005 runtime/memory benchmark smoke test OK")
          PY
      - name: Reproduce NOEMA-005 sharded reduction simulation and compare frozen results
        run: |
          python --version
          python -c "import platform; print(platform.platform())"
          python scripts/simulate_noema005_parallel_reduction.py --output "$RUNNER_TEMP/noema005-parallel.json"
          python - "$RUNNER_TEMP/noema005-parallel.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path("data/noema-005/parallel-reduction-results.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("NOEMA-005 parallel reduction results differ from frozen summary")
          print("NOEMA-005 parallel reduction simulation matches 330-case frozen summary")
          PY
      - name: Run finite-sample simulation smoke test
        run: python scripts/short_sequence_bias_simulation.py --trials 2000
      - name: Build public site and verify publication boundary
        run: |
          python scripts/build_site.py --output "$RUNNER_TEMP/noema-site"
          test -f "$RUNNER_TEMP/noema-site/index.html"
          test -f "$RUNNER_TEMP/noema-site/assets/articles.css"
          test -f "$RUNNER_TEMP/noema-site/data/research.json"
          test ! -d "$RUNNER_TEMP/noema-site/research/drafts"
          test ! -d "$RUNNER_TEMP/noema-site/research/published"
      - name: Verify pinned SignBase 2.0 audit snapshot
        run: |
          BASE="https://raw.githubusercontent.com/christianbentz/PaleoSigns/b376bd87d9676fbf63f8555d03e06b4c28113740/data/signBase"
          curl --fail --location --silent --show-error "$BASE/Sb2Artifact-2025-03-06.csv" --output /tmp/signbase-objects.csv
          curl --fail --location --silent --show-error "$BASE/Sign-2025-03-06.csv" --output /tmp/signbase-signs.csv
          python scripts/audit_signbase.py \
            --artifacts /tmp/signbase-objects.csv \
            --dictionary /tmp/signbase-signs.csv \
            --output /tmp/signbase-audit.json
          diff -u data/audits/signbase-v2-audit-2026-11-23.json /tmp/signbase-audit.json
      - name: Check HTML document basics
        run: |
          grep -q '<html lang="ka">' index.html
          grep -q '<title>NOEMA' index.html
