name: NOEMA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f data/research.json
          test -f research/TEMPLATE.md
      - name: Validate research JSON
        run: python -m json.tool data/research.json > /dev/null
      - name: Check HTML document basics
        run: |
          grep -q '<html lang="ka">' index.html
          grep -q '<title>NOEMA' index.html
