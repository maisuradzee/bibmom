name: NOEMA quality checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Install pinned site and research-analysis dependencies
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-site.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check numpy==2.3.4
      - name: Validate required files
        id: check_01_validate_required_files
        continue-on-error: true
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/articles.css
          test -f requirements-site.txt
          test -f requirements-test.txt
          test -f data/research.json
          test -f data/noema-005/real-cpu-thread-summary-2026-11-26.json
          test -f data/noema-005/threaded-artifact-provenance-audit-2026-11-26.json
          test -f research/drafts/NOEMA-2026-005-thread-artifact-provenance-audit-2026-11-26.md
          test -f tests/test_noema005_thread_artifact_audit.py
          test -f data/noema-005/threaded-rerun-2026-11-26.json
          test -f scripts/validate_noema005_threaded_rerun.py
          test -f tests/test_noema005_threaded_rerun.py
          test -f data/noema-005/threaded-reruns-2026-11-26.json
          test -f data/noema-005/raw/run-45867519546-gil-enabled.json.gz.b64
          test -f data/noema-005/raw/run-45867519546-free-threaded.json.gz.b64
          test -f scripts/reproduce_noema005_threaded_reruns.py
          test -f tests/test_noema005_threaded_reruns.py
          test -f scripts/validate_noema005_cpu_thread_summary.py
          test -f tests/test_noema005_cpu_thread_summary.py
          test -f data/noema-005/threaded-run-2026-11-27-summary.json
          test -f data/noema-005/threaded-run-2026-11-27-summary.schema.json
          test -f tests/test_noema005_threaded_run_summary.py
          test -f data/noema-005/threaded-run36-artifact-snapshot.json
          test -f data/noema-005/threaded-run36-artifact-snapshot.schema.json
          test -f scripts/reproduce_noema005_run36_threaded.py
          test -f tests/test_noema005_run36_threaded.py
