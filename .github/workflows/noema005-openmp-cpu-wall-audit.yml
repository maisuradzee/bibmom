name: NOEMA-005 OpenMP CPU/wall consistency audit

on:
  push:
    branches:
      - research/noema005-openmp-cpu-wall-audit-2026-11-27
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/noema005-openmp-cpu-wall-audit.yml'
      - 'data/noema-005/native-openmp-raw-report-2026-11-26.json'
      - 'data/noema-005/native-openmp-ci-summary-2026-11-26.json'
      - 'data/noema-005/native-openmp-cpu-wall-consistency-audit-2026-11-27.json'
      - 'data/noema-005/native-openmp-cpu-wall-consistency-audit.schema.json'
      - 'scripts/audit_noema005_openmp_cpu_wall_consistency.py'
      - 'tests/test_noema005_openmp_cpu_wall_consistency.py'
      - 'research/drafts/NOEMA-2026-005-openmp-cpu-wall-consistency-audit-2026-11-27.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noema005-openmp-cpu-wall-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Reproduce frozen CPU/wall consistency audit
        run: python scripts/audit_noema005_openmp_cpu_wall_consistency.py --check
      - name: Validate schema and mutation tests
        run: python -m unittest discover -s tests -p 'test_noema005_openmp_cpu_wall_consistency.py' -v

      - name: Run controlled per-thread CPU clock and affinity diagnostic
        run: python scripts/run_noema005_openmp_timing_diagnostic.py --workers 1,2,4,8 --repetitions 20 --work-items 8000000 --output noema005-openmp-timing-diagnostic.json
      - name: Validate controlled timing diagnostic report
        run: python -m unittest discover -s tests -p 'test_noema005_openmp_timing_diagnostic.py' -v
      - name: Reproduce frozen hosted timing diagnostic
        run: python scripts/reproduce_noema005_openmp_timing_diagnostic.py --check
      - name: Upload controlled timing diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: noema005-openmp-timing-diagnostic
          path: noema005-openmp-timing-diagnostic.json
          if-no-files-found: error
          retention-days: 30
