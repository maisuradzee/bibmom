name: NOEMA-005 actual CPU-thread benchmark

on:
  push:
    branches:
      - research/noema005-real-thread-cpu-2026-11-25
    paths:
      - scripts/benchmark_noema005_threaded_reduction.py
      - tests/test_benchmark_noema005_threaded_reduction.py
      - data/noema-005/threaded-benchmark-protocol.json
      - .github/workflows/noema005-threaded-benchmark.yml
      - data/noema-005/threaded-benchmark-*.json
      - data/research.json
      - research/drafts/NOEMA-2026-005-real-thread-benchmark-addendum.md
      - research/preprints/NOEMA-2026-005-floating-point-summation.md
      - docs/PROJECT_STATUS.md
      - README.md
  pull_request:
    branches: [main]
    paths:
      - scripts/benchmark_noema005_threaded_reduction.py
      - tests/test_benchmark_noema005_threaded_reduction.py
      - data/noema-005/threaded-benchmark-protocol.json
      - .github/workflows/noema005-threaded-benchmark.yml
      - data/noema-005/threaded-benchmark-*.json
      - data/research.json
      - research/drafts/NOEMA-2026-005-real-thread-benchmark-addendum.md
      - research/preprints/NOEMA-2026-005-floating-point-summation.md
      - docs/PROJECT_STATUS.md
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noema005-real-threads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.mode }} CPU-thread benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: gil-enabled
            python_version: "3.14.4"
            expected_gil: enabled
          - mode: free-threaded
            python_version: "3.14.4t"
            expected_gil: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Verify interpreter and GIL mode
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import os
          import platform
          import sys
          import sysconfig
          print(f"implementation={platform.python_implementation()}")
          print(f"platform={platform.platform()}")
          print(f"machine={platform.machine()}")
          print(f"cpu_count={os.cpu_count()}")
          print(f"Py_GIL_DISABLED={sysconfig.get_config_var('Py_GIL_DISABLED')}")
          print(f"gil_enabled={sys._is_gil_enabled()}")
          expected = "${{ matrix.expected_gil }}"
          if expected == "enabled" and not sys._is_gil_enabled():
              raise SystemExit("Expected GIL-enabled CPython")
          if expected == "disabled" and sys._is_gil_enabled():
              raise SystemExit("Expected free-threaded CPython with GIL disabled")
          if expected == "disabled" and not sysconfig.get_config_var("Py_GIL_DISABLED"):
              raise SystemExit("Interpreter is not a free-threaded build")
          PY

      - name: Run threaded reduction unit tests
        run: python -m unittest discover -s tests -p 'test_benchmark_noema005_threaded_reduction.py' -v

      - name: Run actual CPU-thread benchmark
        run: >-
          python scripts/benchmark_noema005_threaded_reduction.py
          --repeat-count 65536
          --workers 1,2,4,8
          --warmups 1
          --repetitions 3
          --expected-gil ${{ matrix.expected_gil }}
          --output "$RUNNER_TEMP/noema005-threaded-${{ matrix.mode }}.json"

      - name: Validate benchmark report
        run: |
          python - "$RUNNER_TEMP/noema005-threaded-${{ matrix.mode }}.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["experiment_id"] == "NOEMA-2026-005-REAL-THREADS-001"
          assert len(report["inputs"]) == 2
          assert len(report["threaded_cases"]) == 2 * 4 * 2 * 3
          assert all(case["native_thread_counts"] == [case["worker_count"]] * 3
                     for case in report["threaded_cases"])
          assert all(case["runs"] == 3 for case in report["threaded_cases"])
          print("PASS: 48 threaded cases, 3 repetitions each, distinct native thread IDs")
          print("GIL:", report["environment"]["gil_enabled"])
          print("CPU:", report["environment"]["cpu_count_process"])
          PY

      - name: Upload measured JSON result
        uses: actions/upload-artifact@v4
        with:
          name: noema005-threaded-${{ matrix.mode }}
          path: ${{ runner.temp }}/noema005-threaded-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
