name: NOEMA-005 legacy public artifact cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/noema005-artifact-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-legacy-unsanitized-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete known unsanitized experiment-002 artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const runIds = [
              46063057964,
              46063057969,
              46063291466,
              46063291702,
              46063405483,
              46063405600
            ];
            for (const runId of runIds) {
              let run;
              try {
                run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
              } catch (error) {
                core.warning("Could not inspect legacy run " + runId + ": " + error.message);
                continue;
              }
              for (let attempt = 0; run.data.status !== "completed" && attempt < 40; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 15000));
                run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
              }
              if (run.data.status !== "completed") {
                core.warning("Run " + runId + " is still active; cleanup will need another attempt.");
                continue;
              }
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 }
              );
              let deleted = 0;
              for (const artifact of artifacts) {
                if (artifact.name.startsWith("noema005-threaded-") ||
                    artifact.name.startsWith("noema005-arm64-")) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deleted += 1;
                }
              }
              core.info("Run " + runId + ": deleted " + deleted + " matching artifact(s).");
            }
